<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(${title})}"></head>
<body>
<header th:replace="~{admin/layout :: menu}"></header>
<main>
    <h1 th:text="${title}">Воспоминания</h1>
    <p class="notice" th:if="${saved}" th:text="${saved}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form class="filters" method="get" th:action="@{/admin/memories}">
        <label>Персона
            <select name="personaId">
                <option value="">все</option>
                <option th:each="persona : ${personas}" th:value="${persona.id}"
                        th:selected="${filter.personaId == persona.id}"
                        th:text="${persona.name}">Персона</option>
            </select>
        </label>
        <label>Категория
            <select name="category">
                <option value="">все</option>
                <option th:each="item : ${categories}" th:value="${item.code}"
                        th:selected="${filter.category == item.code}"
                        th:text="${item.title}">Категория</option>
            </select>
        </label>
        <label>Человек
            <select name="personId">
                <option value="">все</option>
                <option th:each="person : ${people}" th:value="${person.userId}"
                        th:selected="${filter.personId == person.userId}"
                        th:text="${person.title}">Человек</option>
            </select>
        </label>
        <label>Поиск
            <input type="text" name="q" th:value="${filter.text}"/>
        </label>
        <label>Порядок
            <select name="sort">
                <option value="importance" th:selected="${filter.sort != 'date'}">по важности</option>
                <option value="date" th:selected="${filter.sort == 'date'}">по дате события</option>
            </select>
        </label>
        <label class="inline">
            <input type="checkbox" name="coreOnly" value="true" th:checked="${filter.coreOnly}"/>
            только ядро
        </label>
        <label class="inline">
            <input type="checkbox" name="deleted" value="true" th:checked="${filter.deletedOnly}"/>
            удалённые
        </label>
        <button class="primary" type="submit">Применить</button>
        <a class="button" th:href="@{/admin/memories/new(personaId=${filter.personaId})}">Добавить</a>
    </form>

    <p class="hint" th:text="'Найдено: ' + ${page.total}">Найдено: 0</p>

    <table class="list" th:unless="${#lists.isEmpty(page.items)}">
        <thead>
        <tr>
            <th></th>
            <th>Текст</th>
            <th>Категория</th>
            <th>Важность</th>
            <th>Дата</th>
            <th>Люди</th>
            <th>Источник</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="memory : ${page.items}">
            <td><span class="badge" th:if="${memory.core}">ядро</span></td>
            <td th:text="${memory.content}">текст</td>
            <td th:text="${memory.category}">другое</td>
            <td th:text="${memory.importance}">5</td>
            <td th:text="${memory.eventDate != null ? memory.eventDate : '—'}">—</td>
            <td th:text="${#lists.isEmpty(memory.people) ? '—' : #strings.listJoin(memory.people, ', ')}">—</td>
            <td th:text="${memory.source}">auto</td>
            <td>
                <form th:if="${filter.deletedOnly}"
                      th:action="@{/admin/memories/{id}/restore(id=${memory.id})}" method="post">
                    <button class="button secondary" type="submit">Восстановить</button>
                </form>
                <a th:unless="${filter.deletedOnly}" class="button secondary"
                   th:href="@{/admin/memories/{id}(id=${memory.id})}">Править</a>
                <a th:unless="${filter.deletedOnly}" class="button secondary"
                   th:href="@{/admin/memories/{id}/delete(id=${memory.id})}">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="hint" th:if="${#lists.isEmpty(page.items)}">Ничего не найдено.</p>

    <div class="toolbar" th:if="${page.totalPages > 1}">
        <a class="button secondary" th:if="${page.hasPrev}"
           th:href="@{/admin/memories(personaId=${filter.personaId}, category=${filter.category},
                     personId=${filter.personId}, q=${filter.text}, coreOnly=${filter.coreOnly},
                     sort=${filter.sort}, page=${page.page - 1})}">Назад</a>
        <span class="hint" th:text="'Страница ' + ${page.page} + ' из ' + ${page.totalPages}">1</span>
        <a class="button secondary" th:if="${page.hasNext}"
           th:href="@{/admin/memories(personaId=${filter.personaId}, category=${filter.category},
                     personId=${filter.personId}, q=${filter.text}, coreOnly=${filter.coreOnly},
                     sort=${filter.sort}, page=${page.page + 1})}">Вперёд</a>
    </div>
</main>
</body>
</html>
