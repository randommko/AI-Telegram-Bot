<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="'Админка · ' + ${title}">Админка</title>
    <style>
        :root { color-scheme: light; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
               background: #f4f5f7; color: #1d2129; }
        header { background: #1d2129; padding: 12px 20px; }
        header nav { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
        header a { color: #e8eaed; text-decoration: none; font-size: 14px; }
        header a:hover { color: #fff; text-decoration: underline; }
        header form { margin-left: auto; }
        header button { background: #3b4a5f; color: #fff; border: 0; border-radius: 4px;
                        padding: 6px 12px; cursor: pointer; font-size: 14px; }
        main { max-width: 960px; margin: 24px auto; padding: 0 20px; }
        h1 { font-size: 22px; margin: 0 0 16px; }
        .error { color: #b3261e; }
        .ok { color: #1e6b3a; }
        form.login { background: #fff; border: 1px solid #dcdfe4; border-radius: 6px;
                     padding: 20px; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
        form.login label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
        form.login input { padding: 8px; border: 1px solid #c4c8ce; border-radius: 4px; font-size: 15px; }
        form.login button { background: #1d2129; color: #fff; border: 0; border-radius: 4px;
                            padding: 10px; font-size: 15px; cursor: pointer; }
        .note { background: #fff; border-left: 3px solid #c4c8ce; padding: 12px 16px; font-size: 14px; }
        details.note summary { cursor: pointer; font-weight: 600; }
        details.note ol, details.note ul { margin: 8px 0; padding-left: 22px; }
        details.note li { margin-bottom: 6px; }
        details.note code { background: #eef0f3; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
        .notice { background: #e8f4ea; border-left: 3px solid #1e6b3a; padding: 10px 14px;
                  margin-bottom: 16px; font-size: 14px; }
        form.setting { background: #fff; border: 1px solid #dcdfe4; border-radius: 6px; padding: 18px; }
        .group { margin-bottom: 24px; }
        .group h2 { font-size: 16px; margin: 0 0 12px; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .field label { font-size: 13px; color: #3b4a5f; }
        .field input, .field textarea { padding: 8px; border: 1px solid #c4c8ce; border-radius: 4px;
                                        font: inherit; font-size: 14px; }
        .field textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, monospace;
                          font-size: 13px; }
        .field .error { color: #b3261e; font-size: 13px; }
        button.primary { background: #1d2129; color: #fff; border: 0; border-radius: 4px;
                         padding: 10px 18px; font-size: 15px; cursor: pointer; }
        .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
        .button { display: inline-block; background: #1d2129; color: #fff; text-decoration: none;
                  padding: 8px 14px; border-radius: 4px; font-size: 14px; }
        .button.secondary { background: #e8eaed; color: #1d2129; }
        button.danger { background: #b3261e; color: #fff; border: 0; border-radius: 4px;
                        padding: 6px 12px; font-size: 13px; cursor: pointer; }
        table.list { width: 100%; border-collapse: collapse; background: #fff;
                     border: 1px solid #dcdfe4; border-radius: 6px; }
        table.list th, table.list td { text-align: left; padding: 8px 10px;
                                       border-bottom: 1px solid #eef0f3; font-size: 14px; }
        table.list th { background: #f0f2f5; font-weight: 600; }
        table.list tr.group-title td { background: #e8eaed; font-weight: 600; color: #1d2129; }
        .hint { font-size: 13px; color: #3b4a5f; }
        fieldset { border: 1px solid #dcdfe4; border-radius: 6px; padding: 12px 16px; margin: 0 0 16px; }
        legend { font-size: 13px; color: #3b4a5f; padding: 0 6px; }
        form.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: #fff;
                       border: 1px solid #dcdfe4; border-radius: 6px; padding: 12px 16px; margin-bottom: 12px; }
        form.filters label, .field label.select { display: flex; flex-direction: column; gap: 4px;
                                                  font-size: 13px; color: #3b4a5f; }
        form.filters label.inline { flex-direction: row; align-items: center; gap: 6px; }
        form.filters input, form.filters select, .field select { padding: 7px; border: 1px solid #c4c8ce;
                                                                border-radius: 4px; font: inherit; font-size: 14px; }
        form.analyze { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .badge { background: #fdecea; color: #b3261e; border-radius: 10px; padding: 2px 8px; font-size: 12px; }
        select[multiple] { min-height: 120px; }
        .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 16px; border-bottom: 1px solid #dcdfe4; }
        .tabs a { padding: 8px 14px; font-size: 14px; color: #3b4a5f; text-decoration: none;
                  border: 1px solid transparent; border-bottom: 0; border-radius: 4px 4px 0 0; }
        .tabs a.active { background: #fff; border-color: #dcdfe4; color: #1d2129; font-weight: 600; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 32px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 32px; }
        .range-row { display: flex; align-items: center; gap: 10px; }
        .range-row output { min-width: 4ch; font-variant-numeric: tabular-nums; font-size: 13px; color: #3b4a5f; }
        .checkbox-line { flex-direction: row; align-items: center; gap: 8px; }
        h2.section { font-size: 16px; margin: 24px 0 8px; }
        .field label { display: flex; align-items: center; }
        .tip { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
               margin-left: 6px; border-radius: 50%; background: #e8eaed; color: #3b4a5f; font-size: 11px;
               font-style: normal; cursor: help; position: relative; }
        .tip:hover::after, .tip:focus::after { content: attr(data-tip); position: absolute; left: 0; top: 22px;
               z-index: 10; width: 280px; background: #1d2129; color: #fff; font-size: 12px; line-height: 1.4;
               padding: 8px 10px; border-radius: 4px; font-weight: 400; }
        input[type="range"] { width: 100%; }
        .hidden { display: none; }
    </style>
</head>
<body>
<header th:fragment="menu">
    <nav>
        <a th:href="@{/admin/personas}">Персоны</a>
        <a th:href="@{/admin/memories}">Воспоминания</a>
        <a th:href="@{/admin/chats}">Чаты</a>
        <a th:if="${owner}" th:href="@{/admin/prompt}">Промпт</a>
        <a th:if="${owner}" th:href="@{/admin/emotions}">Эмоции</a>
        <a th:if="${owner}" th:href="@{/admin/settings}">Настройки</a>
        <a th:if="${owner}" th:href="@{/admin/moderators}">Модераторы</a>
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit">Выйти</button>
        </form>
    </nav>
</header>
<p th:fragment="liveData" class="note">
    Админка работает с живыми данными бота: правки применяются к следующему запросу, перезапуск не нужен.
</p>
</body>
</html>
