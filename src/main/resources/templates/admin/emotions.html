<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(${title})}"></head>
<body>
<header th:replace="~{admin/layout :: menu}"></header>
<main>
    <h1 th:text="${title}">Эмоции</h1>
    <p th:replace="~{admin/layout :: liveData}"></p>
    <p class="notice" th:if="${saved}">Справочник сохранён. Следующий ответ считается по новым значениям.</p>

    <form class="setting" th:action="@{/admin/emotions}" method="post">
        <section class="group">
            <h2>Справочник</h2>
            <p class="hint">Шкалы — 0..10, вес в агрессию — от -1 до 1, затухание — не меньше нуля.</p>

            <fieldset th:each="view : ${emotions}">
                <legend th:text="${view.title()}">Эмоция</legend>
                <div class="grid-2">
                    <div class="field">
                        <label th:for="${'title_' + view.emotion().code()}">Подпись</label>
                        <input type="text"
                               th:id="${'title_' + view.emotion().code()}"
                               th:name="${'title_' + view.emotion().code()}"
                               th:value="${view.title()}"/>
                        <span class="error" th:if="${errors['title_' + view.emotion().code()]}"
                              th:text="${errors['title_' + view.emotion().code()]}"></span>
                    </div>

                    <div class="field">
                        <label th:for="${'weight_' + view.emotion().code()}">Вес в агрессию (-1..1)</label>
                        <input type="number" step="0.01" min="-1" max="1"
                               th:id="${'weight_' + view.emotion().code()}"
                               th:name="${'weight_' + view.emotion().code()}"
                               th:value="${view.weight()}"/>
                        <span class="error" th:if="${errors['weight_' + view.emotion().code()]}"
                              th:text="${errors['weight_' + view.emotion().code()]}"></span>
                    </div>

                    <div class="field">
                        <label th:for="${'decay_' + view.emotion().code()}">Затухание в час</label>
                        <input type="number" step="0.01" min="0"
                               th:id="${'decay_' + view.emotion().code()}"
                               th:name="${'decay_' + view.emotion().code()}"
                               th:value="${view.decay()}"/>
                        <span class="error" th:if="${errors['decay_' + view.emotion().code()]}"
                              th:text="${errors['decay_' + view.emotion().code()]}"></span>
                    </div>

                    <div class="field">
                        <label th:for="${'base_' + view.emotion().code()}">Базовое значение (0..10)</label>
                        <input type="number" min="0" max="10"
                               th:id="${'base_' + view.emotion().code()}"
                               th:name="${'base_' + view.emotion().code()}"
                               th:value="${view.base()}"/>
                        <span class="error" th:if="${errors['base_' + view.emotion().code()]}"
                              th:text="${errors['base_' + view.emotion().code()]}"></span>
                    </div>
                </div>
            </fieldset>

            <p class="hint" th:each="emotion : ${derived}"
               th:text="${emotion.title() + ': вычисляется из остальных эмоций, значения не редактируются.'}"></p>
        </section>

        <section class="group">
            <h2>Фразы по полосам значения</h2>
            <p class="hint">Полосы 0-1, 2-4, 5-6, 7-8, 9-10: текст попадает в промпт, когда значение эмоции в этой полосе.</p>

            <div class="field" th:each="row : ${phrases}">
                <label th:for="${row.fieldKey()}"
                       th:text="${row.title() + ' ' + row.from() + '-' + row.to()}">Фраза</label>
                <textarea th:id="${row.fieldKey()}" th:name="${row.fieldKey()}"
                          th:text="${row.phrase()}"></textarea>
                <span class="error" th:if="${errors[row.fieldKey()]}"
                      th:text="${errors[row.fieldKey()]}"></span>
            </div>
        </section>

        <button class="primary" type="submit">Сохранить</button>
    </form>
</main>
</body>
</html>
