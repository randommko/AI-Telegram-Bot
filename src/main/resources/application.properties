# Держим остановку в бюджете systemd TimeoutStopSec=20 (deploy/telegram-bot.service).
spring.lifecycle.timeout-per-shutdown-phase=10s

# Веб-админка: только loopback, доступ через SSH-туннель.
# Пустая BOT_ADMIN_BIND означает «все интерфейсы» — переменную не задавать пустой.
server.address=${BOT_ADMIN_BIND:127.0.0.1}
server.port=${BOT_ADMIN_PORT:8081}
server.servlet.session.timeout=8h
