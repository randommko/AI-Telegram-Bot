schema: spec-driven

context: |
  Язык артефактов — русский.
  Стек: Java 17, Spring Boot 3.5, Maven. Модули: core (общая логика и доступ к базе),
  bot (Telegram-бот), admin (веб-админка). База — PostgreSQL, миграции в migrations/.
  Сборка и проверки:
    "C:\Program Files\apache-maven-3.8.7\bin\mvn.cmd" clean test        — весь набор тестов;
    "C:\Program Files\apache-maven-3.8.7\bin\mvn.cmd" -pl bot -am test  — тесты одного модуля.
  Деплой: push в main запускает Deploy bot и Deploy admin по своим paths; изменения только
  в openspec/** и *.md деплой не запускают.
  Основные спеки — openspec/specs/<capability>/spec.md, имена изменений — kebab-case.

  Перед созданием артефакта:
  - термины — glossary/business.md и glossary/technical.md, рядом с артефактом кладётся
    <артефакт>-glossary-reference.md;
  - действующие решения — openspec/adr/ (только статус «Принято», без «Заменено на ADR-NNNN»);
  - новое долговечное решение оформляется ADR по правилам openspec/adr/README.md;
  - стиль артефактов — openspec/preferences.md.
  Не хватает контекста — не угадывай, сформулируй, какого.

rules:
  proposal:
    - "Документ уровня аналитика: зачем, что меняется, что вне объёма, на что влияет."
    - "Обязательны разделы «Вне объёма» и Impact."
    - "Без имён классов и методов, путей к файлам исходников и выбора библиотек — это design.md и Impact."
    - "Термины бери из глоссария; рядом с proposal — proposal-glossary-reference.md."
  design:
    - "Решения с альтернативами и причиной отказа от них; риски с мерами; явные открытые вопросы."
    - "Диаграммы — Mermaid, если без них решение непонятно."
    - "Опирайся на принятые ADR из openspec/adr/; рядом с design — design-glossary-reference.md."
  specs:
    - "Требования через SHALL/MUST, сценарии в формате WHEN/THEN, по-русски."
    - "Термины — из глоссария; рядом со спекой — spec-glossary-reference.md."
  tasks:
    - "Проверка — командами проекта (Maven по полному пути), не gradlew."
    - "В группе задач — свои тесты и документация; последняя группа только интеграционная проверка."
    - "Рядом с tasks — tasks-glossary-reference.md."

operations:
  apply:
    guidance:
      - "Новый термин сначала в glossary/business.md или glossary/technical.md, затем в артефакт и его glossary-reference."
      - "Новую настройку или термин пояснять в самом артефакте, а не только в переписке."
  archive:
    guidance:
      - "Кратко резюмировать исход архивации и проверить, что основная спека обновилась."
      - "Долговечное решение из изменения оформить ADR в openspec/adr/ и добавить строку в индекс."
