<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Вход')}"></head>
<body>
<main class="login-page">
    <h1>Вход в админку</h1>
    <p class="error" th:if="${param.error}">Неверный логин или пароль.</p>
    <p class="ok" th:if="${param.logout}">Сессия завершена.</p>
    <form class="login" th:action="@{/admin/login}" method="post">
        <label>
            Логин
            <input type="text" name="username" autocomplete="username" autofocus required/>
        </label>
        <label>
            Пароль
            <input type="password" name="password" autocomplete="current-password" required/>
        </label>
        <button type="submit">Войти</button>
    </form>
    <p class="hint">
        Логин модератора выдаёт владелец. У владельца логин <code>admin</code>, пароль — значение
        <code>BOT_ADMIN_PASSWORD</code> из окружения сервиса.
    </p>
</main>
</body>
</html>
