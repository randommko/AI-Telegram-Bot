<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(${title})}"></head>
<body>
<header th:replace="~{admin/layout :: menu}"></header>
<main>
    <h1 th:text="${title}">Воспоминание</h1>

    <form class="setting"
          th:action="@{/admin/personas/{personaId}/memories(personaId=${form.personaId})}"
          th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{personaId}"/>

        <p class="hint">
            Персона: <strong th:text="${personaName}">Имя</strong> — воспоминание принадлежит только ей.
        </p>
        <span class="error" th:if="${errors['personaId']}" th:text="${errors['personaId']}"></span>

        <div class="field">
            <label for="content">Текст воспоминания</label>
            <textarea id="content" th:field="*{content}"></textarea>
            <span class="error" th:if="${errors['content']}" th:text="${errors['content']}"></span>
        </div>

        <div class="field">
            <label for="category">Категория</label>
            <select id="category" th:field="*{category}">
                <option th:each="item : ${categories}" th:value="${item.code}"
                        th:text="${item.title}">Категория</option>
            </select>
            <span class="error" th:if="${errors['category']}" th:text="${errors['category']}"></span>
        </div>

        <div class="field">
            <label for="importance">Важность (1..10)</label>
            <input type="text" id="importance" th:field="*{importance}"/>
            <span class="error" th:if="${errors['importance']}" th:text="${errors['importance']}"></span>
        </div>

        <div class="field">
            <label for="eventDate">Дата события (ГГГГ-ММ-ДД, можно пусто)</label>
            <input type="text" id="eventDate" th:field="*{eventDate}"/>
            <span class="error" th:if="${errors['eventDate']}" th:text="${errors['eventDate']}"></span>
        </div>

        <div class="field">
            <label for="peopleSearch">Люди</label>
            <input type="text" id="peopleSearch" class="people-search" autocomplete="off"
                   placeholder="Поиск по нику"/>
            <div class="people-list">
                <label class="checkbox-line" th:each="person : ${allPeople}"
                       th:attr="data-search=${person.title}">
                    <input type="checkbox" name="people" th:value="${person.userId}"
                           th:checked="${#lists.contains(people, person.userId)}"/>
                    <span th:text="${person.title}">Человек</span>
                </label>
            </div>
            <span class="hint">
                Отмеченные остаются выбранными при поиске. Снимите галочку и сохраните,
                чтобы убрать связь воспоминания с человеком.
            </span>
        </div>

        <div class="field">
            <label>
                <input type="checkbox" th:field="*{core}"/>
                Незыблемое (ядро) — анализ не сможет её удалить
            </label>
        </div>

        <div class="field">
            <label for="source">Источник</label>
            <input type="text" id="source" th:value="${form.source}" disabled/>
            <span class="hint">Источник не меняется: ручные записи остаются manual, созданные анализом — auto.</span>
        </div>

        <div class="toolbar">
            <button class="primary" type="submit">Сохранить</button>
            <a class="button secondary"
               th:href="@{/admin/personas/{id}(id=${form.personaId},tab='memories')}">Отмена</a>
        </div>
    </form>

    <script>
        (function () {
            var search = document.querySelector('.people-search');
            var list = document.querySelector('.people-list');
            if (!search || !list) return;

            search.addEventListener('input', function () {
                var needle = search.value.trim().toLowerCase();
                Array.prototype.forEach.call(list.querySelectorAll('label'), function (label) {
                    var text = (label.dataset.search || label.textContent || '').toLowerCase();
                    label.hidden = needle !== '' && text.indexOf(needle) === -1;
                });
            });
        })();
    </script>
</main>
</body>
</html>
