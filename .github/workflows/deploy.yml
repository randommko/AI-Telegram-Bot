name: Build and Deploy Java Application

on:
  push:
    branches:
      - main # Укажите нужную ветку, например, "main" или "master"
    # Документация не влияет на jar и systemd-юнит, поэтому не перезапускает бота.
    paths-ignore:
      - '**/*.md'
      - 'openspec/**'
      - '.agents/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          # Параметры запуска уходят в systemd через env-файл: аргументы командной
          # строки видны в ps любому локальному пользователю на сервере.
          cat > bot.env <<'ENVFILE'
          BOT_TOKEN=${{ secrets.TOKEN_TG_BOT }}
          BOT_DB_URL=${{ secrets.DB_ADDR_TG_BOT }}
          BOT_DB_USER=${{ secrets.DB_USER_TG_BOT }}
          BOT_DB_PASSWORD=${{ secrets.DB_PASS_TG_BOT }}
          BOT_AI_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          BOT_ADMIN_PASSWORD=${{ secrets.BOT_ADMIN_PASSWORD }}
          BOT_PROXY_TYPE=${{ secrets.BOT_PROXY_TYPE }}
          BOT_PROXY_HOST=${{ secrets.BOT_PROXY_HOST }}
          BOT_PROXY_PORT=${{ secrets.BOT_PROXY_PORT }}
          BOT_PROXY_USER=${{ secrets.BOT_PROXY_USER }}
          BOT_PROXY_PASS=${{ secrets.BOT_PROXY_PASS }}
          ENVFILE

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "install -d -m 700 /etc/telegram-bot"
          scp bot.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/etc/telegram-bot/bot.env
          rm -f bot.env
          scp target/telegram-bot-1.0.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/usr/bin/tg_bot/
          scp deploy/telegram-bot.service ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/etc/systemd/system/telegram-bot.service

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            chmod 600 /etc/telegram-bot/bot.env
            systemctl daemon-reload
            systemctl enable telegram-bot
            systemctl restart telegram-bot
            sleep 25
            journalctl -u telegram-bot --no-pager -n 20
            systemctl is-active telegram-bot
          EOF

        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BOT_TOKEN: ${{ secrets.TOKEN_TG_BOT }}
          DB_ADDR: ${{ secrets.DB_ADDR_TG_BOT }}
          DB_USER: ${{ secrets.DB_USER_TG_BOT }}
          DB_PASS: ${{ secrets.DB_PASS_TG_BOT }}
          GIGACHAT_API_KEY : ${{ secrets.DEEPSEEK_API_KEY }}
