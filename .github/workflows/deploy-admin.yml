name: Deploy admin

on:
  push:
    branches:
      - main
    # Админка перезапускается только от своих путей и от общего core.
    paths:
      - 'admin/**'
      - 'core/**'
      - 'pom.xml'
      - 'migrations/config/**'
      - 'migrations/configurator/**'
      - 'deploy/telegram-bot-admin.service'
      - '.github/workflows/deploy-admin.yml'

# Два пуша подряд не должны делить /tmp и удалять файлы друг друга: запуски идут по очереди.
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -pl admin -am clean package -DskipTests

      - name: Deploy to VPS
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          # Секреты уходят в systemd через env-файл: аргументы командной строки видны в ps.
          # Токена Telegram и прокси здесь нет: админка не обращается к Telegram.
          cat > admin.env <<'ENVFILE'
          BOT_DB_URL=${{ secrets.DB_ADDR_TG_BOT }}
          BOT_DB_USER=${{ secrets.DB_USER_ADMIN }}
          BOT_DB_PASSWORD=${{ secrets.DB_PASS_ADMIN }}
          BOT_ADMIN_PASSWORD=${{ secrets.BOT_ADMIN_PASSWORD }}
          BOT_ADMIN_PORT=8081
          # Админку открывает VPN-подсеть 10.8.0.0/24, порт ограничен правилом ufw.
          BOT_ADMIN_BIND=0.0.0.0
          ENVFILE

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "true"
          scp admin.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/admin.env
          rm -f admin.env
          scp admin/target/telegram-bot-admin-1.0.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/telegram-bot-admin-1.0.jar
          scp deploy/telegram-bot-admin.service ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/telegram-bot-admin.service

          # Обрыв scp раньше оставался незамеченным: сверяем размер и только потом ставим файл.
          expected=$(stat -c %s admin/target/telegram-bot-admin-1.0.jar)
          actual=$(ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "stat -c %s /tmp/telegram-bot-admin-1.0.jar")
          if [ "$expected" != "$actual" ]; then
            echo "jar загружен не полностью: $actual из $expected байт"
            exit 1
          fi

          # deploy не имеет прав писать в /etc и /usr/bin: файлы кладутся в /tmp,
          # а установку, рестарт и проверку разрешает sudoers по точным командам.
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -euo pipefail
            sudo -n install -m 600 -o root -g root /tmp/admin.env /etc/telegram-bot/admin.env
            sudo -n install -m 644 /tmp/telegram-bot-admin-1.0.jar /usr/bin/tg_bot_admin/telegram-bot-admin-1.0.jar
            sudo -n install -m 644 /tmp/telegram-bot-admin.service /etc/systemd/system/telegram-bot-admin.service
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable telegram-bot-admin
            sudo -n systemctl restart telegram-bot-admin
            # is-active у Type=simple значит «процесс запущен», а не «порт открыт»:
            # ждём ответа на /admin/login, иначе падение на старте выглядит успехом.
            ready=""
            for i in $(seq 1 24); do
              if curl -sf -o /dev/null --max-time 3 http://127.0.0.1:8081/admin/login; then
                ready="yes"
                break
              fi
              sleep 5
            done
            status=$(sudo -n systemctl is-active telegram-bot-admin || true)
            journalctl -u telegram-bot-admin --no-pager -n 20
            rm -f /tmp/admin.env /tmp/telegram-bot-admin-1.0.jar /tmp/telegram-bot-admin.service
            if [ "$status" != "active" ] || [ "$ready" != "yes" ]; then
              echo "админка не поднялась после деплоя: служба $status, порт $ready"
              exit 1
            fi
          EOF
