name: Deploy bot

on:
  push:
    branches:
      - main
    # Бот перезапускается только от своих путей и от общего core.
    paths:
      - 'bot/**'
      - 'core/**'
      - 'pom.xml'
      - 'migrations/ai/**'
      - 'deploy/telegram-bot.service'
      - '.github/workflows/deploy-bot.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -pl bot -am clean package -DskipTests

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          # Параметры запуска уходят в systemd через env-файл: аргументы командной
          # строки видны в ps любому локальному пользователю на сервере.
          cat > bot.env <<'ENVFILE'
          BOT_TOKEN=${{ secrets.TOKEN_TG_BOT }}
          BOT_DB_URL=${{ secrets.DB_ADDR_TG_BOT }}
          BOT_DB_USER=${{ secrets.DB_USER_TG_BOT }}
          BOT_DB_PASSWORD=${{ secrets.DB_PASS_TG_BOT }}
          # Ключ провайдера читается из BOT_AI_KEY_<ID>: один провайдер — одна переменная.
          BOT_AI_KEY_DEEPSEEK=${{ secrets.DEEPSEEK_API_KEY }}
          BOT_AI_KEY_GROK=${{ secrets.XAI_API_KEY }}
          BOT_AI_KEY_OPENAI=${{ secrets.OPENAI_API_KEY }}
          BOT_AI_KEY_GEMINI=${{ secrets.GEMINI_API_KEY }}
          BOT_AI_KEY_MISTRAL=${{ secrets.MISTRAL_API_KEY }}
          BOT_AI_KEY_AITUNNEL=${{ secrets.AITUNNEL_API_KEY }}
          BOT_AI_KEY_VENICE=${{ secrets.VENICE_API_KEY }}
          BOT_AI_KEY_ABLITERATION=${{ secrets.ABLITERATION_API_KEY }}
          BOT_ADMIN_PASSWORD=${{ secrets.BOT_ADMIN_PASSWORD }}
          # Админку открывает VPN-подсеть 10.8.0.0/24, порт ограничен правилом ufw.
          # Локально без этой строки админка остаётся на 127.0.0.1.
          BOT_ADMIN_BIND=0.0.0.0
          BOT_PROXY_TYPE=${{ secrets.BOT_PROXY_TYPE }}
          BOT_PROXY_HOST=${{ secrets.BOT_PROXY_HOST }}
          BOT_PROXY_PORT=${{ secrets.BOT_PROXY_PORT }}
          BOT_PROXY_USER=${{ secrets.BOT_PROXY_USER }}
          BOT_PROXY_PASS=${{ secrets.BOT_PROXY_PASS }}
          ENVFILE

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "true"
          scp bot.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/bot.env
          rm -f bot.env
          scp bot/target/telegram-bot-1.0.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/telegram-bot-1.0.jar
          scp deploy/telegram-bot.service ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/telegram-bot.service

          # deploy не имеет прав писать в /etc и /usr/bin: файлы кладутся в /tmp,
          # а установку, рестарт и проверку разрешает sudoers по точным командам.
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo -n install -m 600 -o root -g root /tmp/bot.env /etc/telegram-bot/bot.env
            sudo -n install -m 644 /tmp/telegram-bot-1.0.jar /usr/bin/tg_bot/telegram-bot-1.0.jar
            sudo -n install -m 644 /tmp/telegram-bot.service /etc/systemd/system/telegram-bot.service
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable telegram-bot
            sudo -n systemctl restart telegram-bot
            sleep 25
            journalctl -u telegram-bot --no-pager -n 20
            sudo -n systemctl is-active telegram-bot
            rm -f /tmp/bot.env /tmp/telegram-bot-1.0.jar /tmp/telegram-bot.service
          EOF
